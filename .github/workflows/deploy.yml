name: Deploy to GitHub Pages

# Optional alternative host. If you deploy via Cloudflare Pages (the default —
# see README), leave this workflow alone: it only runs when triggered by hand,
# and requires GitHub Pages to be enabled with "GitHub Actions" as the source.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        env:
          # Set these as repository variables/secrets to activate.
          SITE_URL: ${{ vars.SITE_URL }}
          ANALYTICS_ID: ${{ vars.ANALYTICS_ID }}
          ADSENSE_ID: ${{ vars.ADSENSE_ID }}
        run: npm run build

      - name: Quality gate — links, metadata, structured data
        run: npm run check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
